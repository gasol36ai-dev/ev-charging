const RATE_DATE = "2026-11-21";
const fmt = n => (typeof n === "number" ? n.toFixed(n % 1 ? 1 : 0) : null);
function seasonOf(b, d){
  const m = d.getMonth()+1, day = d.getDate();
  const md = m*100+day;
  const s = b.summer.label;
  let inSummer = false;
  if(s.startsWith("6/1")) inSummer = (md>=601 && md<=930);
  else if(s.startsWith("5/16")) inSummer = (md>=516 && md<=1015);
  if(b.id==="icharging"||b.id==="costco") inSummer=false;
  return inSummer ? b.summer : b.nonsummer;
}
function nowState(b, d){
  if(b.id==="costco") return {price:b.nonsummer.off, period:"單一費率", season:b.nonsummer};
  if(b.id==="icharging") return {price:null, period:"依站點", season:b.nonsummer};
  const se = seasonOf(b,d);
  const wd = d.getDay(), h = d.getHours();
  const isHol = (wd===0||wd===6);
  if(isHol){
    if(se.morningOff && h>=se.morningWin[0] && h<se.morningWin[1]) return {price:se.off, period:"假日離峰", season:se};
    if(typeof se.peak==="number" && !se.noTou && se.peak!==se.hol) return {price:se.hol, period:"假日", season:se};
    return {price:se.hol, period:"假日", season:se};
  }
  const [ps,pe] = se.peakw;
  if(h>=ps && h<pe) return {price:se.peak, period:"尖峰", season:se};
  return {price:se.off, period:"離峰", season:se};
}
function cls(p){ return p==="尖峰"?"peak":(p.startsWith("假日")?"hol":"offpeak"); }

/* ================= 費率頁 ================= */

  main.innerHTML = rows.map(({b,st})=>{

    const priceTxt = typeof st.price==="number" ? fmt(st.price) : "—";
    const isCurSeason = se===b.nonsummer;
    const grid = `
      <div class="grid">
        <div class="kv${typeof se.off!=="number"?" dim":""}"><span>平日離峰</span><b>${fmt(se.off)??"待公告"}</b></div>
        <div class="kv${typeof se.peak!=="number"?" dim":""}"><span>平日尖峰</span><b>${fmt(se.peak)??"待公告"}</b></div>
        <div class="kv${typeof se.hol!=="number"?" dim":""}"><span>假日</span><b>${fmt(se.hol)??"待公告"}</b></div>
      </div>`;
    const extra = b.extra ? `
      <div class="subtable"><b style="color:var(--tx)">${b.extra.title}</b>：離峰 ${fmt(b.extra.off)}／尖峰 ${fmt(b.extra.peak)}／假日 ${fmt(b.extra.hol)} 元。${b.extra.desc||""}</div>`:"";

      <div class="brand"><h2>${b.name}</h2><span class="billing">${b.billing}</span></div>
      <div class="nowrow">
        <span class="nowprice">${priceTxt}</span><span class="unit">元/度</span>
        <span class="tag ${cls(st.period)}">${st.period}</span>

      ${b.offWin?`<p class="notes">時段：離峰 ${b.offWin}｜尖峰 ${b.peakWin}｜${b.holNote}</p>`:""}

    </div>`;
  }).join("");

    "資料為公告費率彙整（非即時 API）｜站點資料：交通部 TDX 開放資料｜假日＝週六日；國定假日與連假規則以各品牌 App 為準";

function pickCity(lat,lon){
  for(const [c,n,bb] of CITY) if(lat>=bb[0]&&lat<=bb[2]&&lon>=bb[1]&&lon<=bb[3]) return c;
  let best=null,bd=1e9;
  for(const [c,n,bb] of CITY){const cy=(bb[0]+bb[2])/2,cx=(bb[1]+bb[3])/2,d=(lat-cy)**2+(lon-cx)**2;if(d<bd){bd=d;best=c}}
  return best;
}
const hav = (a,b,c,d)=>{const R=6371e3,p=Math.PI/180,dl=(c-a)*p,dk=(d-b)*p,x=Math.sin(dl/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dk/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const CN = {1:"CCS1",2:"CCS2",3:"CHAdeMO",4:"Tesla_TPC",5:"J1772",6:"Type2",254:"其他",255:"未知"};
let myConnFilter = new Set([1,5]); // 預設：CCS1 快充 + J1772 慢充（納智捷）
let lastCity=null, lastSt=null, lastRate=null, lastLive=null, myLoc=null;

function showTab(t){
  document.getElementById("tab-rates").classList.toggle("on",t==="rates");
  document.getElementById("tab-stations").classList.toggle("on",t==="stations");
  if(t==="rates"){renderRates();document.getElementById("sorting").textContent="";}
  else stationsEntry();
}
function stationsEntry(){
  const main=document.getElementById("main");
  document.getElementById("sorting").textContent="";
  main.innerHTML=`<div class="card"><div class="bar"><button id="gps">📍 用我的位置找附近站點</button>
    <span style="font-size:12px;color:var(--tx2)">或</span>
    <select class="select" id="citySel" style="flex:1"><option value="">選擇縣市…</option>${CITY.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select></div>
    <p class="notes" id="gpsmsg">定位只在本機處理；站點資料由交通部 TDX 開放資料即時取得。導航按鈕會開啟 Google Maps。</p></div>
    <div id="stlist"></div>`;
  document.getElementById("gps").onclick=startGeo;
  document.getElementById("citySel").onchange=e=>{if(e.target.value)loadCity(e.target.value,null,null)};
  if(lastCity) loadCity(lastCity, myLoc?myLoc[0]:null, myLoc?myLoc[1]:null, true);
  else if(myLoc) loadCity(pickCity(...myLoc), myLoc[0], myLoc[1], true);
}
function startGeo(){
  const msg=document.getElementById("gpsmsg");
  if(!navigator.geolocation){msg.textContent="此瀏覽器不支援定位，請改用縣市選單。";return}
  msg.textContent="定位中…（請允許瀏覽器位置權限）";
  navigator.geolocation.getCurrentPosition(
    p=>{myLoc=[p.coords.latitude,p.coords.longitude];msg.textContent=`✅ 定位成功（誤差約 ${Math.round(p.coords.accuracy)} 公尺）`;loadCity(pickCity(...myLoc),myLoc[0],myLoc[1])},
    e=>{msg.textContent="定位被拒或失敗（"+e.code+"）。可改用上方縣市選單；iOS 需允許網站使用位置。"},
    {timeout:12000,maximumAge:60000});
}
async function loadCity(city,lat,lon,keep){
  lastCity=city;
  const list=document.getElementById("stlist");
  if(!keep){list.innerHTML=`<div class="status"><span class="spin"></span>向 TDX 載入${CITY.find(c=>c[0]===city)[1]}充電站…</div>`}
  try{
    const [s,r] = await Promise.all([
      fetch(`${API}/v1/EV/Station/City/${city}?${q({$format:"JSON",$top:999})}`).then(x=>x.json()),
      fetch(`${API}/v1/EV/ChargingRate/City/${city}?${q({$format:"JSON",$top:999})}`).then(x=>x.json()),
    ]);
    if(!s.Stations) throw new Error(JSON.stringify(s).slice(0,120));
    lastSt=s.Stations; lastRate=r.ChargingRates||[];
    renderStations(lat,lon);
  }catch(ex){
    list.innerHTML=`<div class="status">載入失敗：${ex.message}<br>可能是 TDX 訪客額度用完（每 IP 每日 20 次）或網路異常，稍後再試。</div>`;
  }
}
function renderStations(lat,lon){
  const list=document.getElementById("stlist");
  const cname=CITY.find(c=>c[0]===lastCity)[1];
  let rows=lastSt.map(st=>{
    let d=lat!=null?hav(lat,lon,st.PositionLat,st.PositionLon):null;
    const cs=(st.Connectors||[]).map(c=>c.Type);
    const match=[...myConnFilter].some(t=>cs.includes(t));
    return {st,d,cs,match};
  }).filter(r=>r.match);
  rows.sort((a,b)=>(a.d??1e12)-(b.d??1e12));
  const rateMap={}; (lastRate||[]).forEach(r=>{if(!rateMap[r.StationID])rateMap[r.StationID]=r});
  const upd=lastSt.length?`（TDX 資料更新：${lastSt[0].SrcUpdateTime||"—"}）`:"";
  const head=`
    <div class="card">
      <div class="bar">
        <span style="font-size:13px;font-weight:700">${cname}｜符合接頭：${rows.length} 站</span>
        <button class="${myConnFilter.has(1)?"on":""}" onclick="tg(1)">CCS1</button>
        <button class="${myConnFilter.has(5)?"on":""}" onclick="tg(5)">J1772</button>
        <button onclick="toggleAll()">全部接頭</button>
        <button onclick="loadLive()" id="livebtn">🔋 即時槍況</button>
      </div>
      <p class="notes">站點清單 ${upd}｜費率卡請切「費率查詢」分頁</p>
    </div>`;
  if(!rows.length){list.innerHTML=head+`<div class="status">此縣市沒有符合所選接頭的站點，試試「全部接頭」。</div>`;return}
  list.innerHTML=head+rows.slice(0,50).map(({st,d,cs})=>{
    const my=cs.filter(t=>myConnFilter.has(t)).map(t=>`<span class="badge ccs1">${CN[t]}</span>`).join("");
    const other=cs.filter(t=>!myConnFilter.has(t)).map(t=>`<span class="badge">${CN[t]}</span>`).join("");
    const rt=rateMap[st.StationID];
    let rateTxt="";
    const textRate=(st.ChargingRate||"").replace(/\r?\n/g,"；").trim();
    const textHasPrice=/\d+(\.\d+)?\s*元/.test(textRate);
    if(rt&&rt.Rates&&rt.Rates.length){
      let structured=rt.Rates.map(r=>{
        const day={1:"每日",2:"平日",3:"假日",4:"假日",5:"特殊平日",6:"特殊假日",7:"特殊假日"}[r.DayType]||"";
        const win=(r.StartTime&&r.EndTime)?` ${r.StartTime}–${r.EndTime}`:"";
        const pk={0:"",1:"尖峰",2:"離峰",3:"半尖峰"}[r.Peak]||"";
        const sea=(r.Summer===true)?"夏月":(r.Summer===false?"非夏月":"");
        const price=r.RateType===1?"免費":`${r.RatePrice} 元/${({2:"度",3:"分",4:"時"})[r.RateType]||"?"}`;
        return `${sea}${day}${pk}${win}：${price}`;
      }).filter(x=>!/：undefined/.test(x)).slice(0,8).join("；");
      if(rt.OvertimeRate) structured+=` ｜佔位費：${rt.OvertimeRate}`;
      const allFree=rt.Rates.every(r=>r.RateType===1);
      if(allFree&&textHasPrice){
        rateTxt=`⚠ 資料源矛盾（TDX 兩欄不一致）：結構化費率=免費，但站點文字費率=「${textRate}」。實際價格以現場/App 為準`;
      } else {
        rateTxt=structured+(textRate&&!allFree&&textRate!==structured?` ｜站點補充：${textRate}`:"");
      }
    } else if(textRate) rateTxt=textRate;
    const lv=lastLive&&lastLive[st.StationID];
    const lvBad=lv?`<span class="badge live-ok">可用 ${lv[1]}</span><span class="badge live-busy">充電中 ${lv[2]}</span>${lv[3]?`<span class="badge live-fault">故障 ${lv[3]}</span>`:""}<span class="badge" style="color:var(--tx2)">更新 ${lv.t}</span>`:"";
    const dist=d!=null?(d<1000?Math.round(d)+" m":(d/1000).toFixed(1)+" km"):"";
    return `<div class="card stcard">
      <div class="stmain">
        <h3>${st.StationName.Zh_tw||st.StationName.En||"充電站"} <span class="dist">${dist}</span></h3>
        <div class="meta">🅿️ ${st.Spaces??"?"} 車位｜⚡ ${st.ChargingPoints??"?"} 樁｜🕒 ${st.ServiceTime||"—"}</div>
        <div>${my}${other}${lvBad}</div>
        ${rateTxt?`<div class="ratebox">💰 ${rateTxt}</div>`:""}
        <a class="gobtn" href="https://www.google.com/maps/dir/?api=1&destination=${st.PositionLat},${st.PositionLon}&travelmode=driving" target="_blank" rel="noopener">🧭 Google Maps 導航</a>
      </div>
    </div>`;
  }).join("");
}
function tg(t){myConnFilter.has(t)?myConnFilter.delete(t):myConnFilter.add(t);renderStations(myLoc?myLoc[0]:null,myLoc?myLoc[1]:null)}
function toggleAll(){myConnFilter=new Set(Object.keys(CN).map(Number).filter(x=>x<254));renderStations(myLoc?myLoc[0]:null,myLoc?myLoc[1]:null)}
async function loadLive(){
  document.getElementById("livebtn").textContent="載入中…";
  try{
    const r=await fetch(`${API}/v1/EV/ConnectorLiveStatus/City/${lastCity}?${q({$format:"JSON",$top:999})}`).then(x=>x.json());
    const m={};
    (r.LiveStatuses||r.ConnectorLiveStatuses||[]).forEach(l=>{
      const k=m[l.StationID]||(m[l.StationID]=[0,0,0,0]);
      k[l.ConnectorStatus]=(k[l.ConnectorStatus]||0)+1;
      if(l.LastUpdateTime&&(!k.t||l.LastUpdateTime>k.t))k.t=l.LastUpdateTime;
    });
    lastLive=m;renderStations(myLoc?myLoc[0]:null,myLoc?myLoc[1]:null);
  }catch(e){document.getElementById("livebtn").textContent="🔋 即時槍況（失敗，再試）"}
}

/* ================= 啟動 ================= */
function tick(){document.getElementById("clock").textContent=new Date().toLocaleString("zh-TW",{weekday:"short",hour:"2-digit",minute:"2-digit",month:"numeric",day:"numeric"})}
tick();setInterval(tick,30000);
renderRates();
setInterval(()=>{if(document.getElementById("tab-rates").classList.contains("on"))renderRates()},60000);
</script>
</body>
</html>
